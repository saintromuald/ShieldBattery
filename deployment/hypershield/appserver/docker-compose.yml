volumes:
  app_logs:
  certs:
  db_data:
  nginx_conf:
  nginx_dhparam:
  nginx_html:
  nginx_vhost:
  redis_data:
  uploaded_files:

networks:
  frontend:
    enable_ipv6: true
  backend:

services:
  app_server:
    image: ${HYPERSHIELD_SERVER_IMAGE:-ghcr.io/saintromuald/hypershield-server}:${SB_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      VIRTUAL_HOST: ${SB_VIRTUAL_HOST}
      VIRTUAL_PORT: 5555
      LETSENCRYPT_HOST: ${SB_VIRTUAL_HOST}
      DATABASE_URL: postgres://${SB_DB_USER:-hypershield}:${SB_DB_PASSWORD}@db/${SB_DB:-hypershield}
      SB_DB_POOL_MAX: ${SB_DB_POOL_MAX}
      SB_HTTP_PORT: 5555
      SB_HTTPS_REVERSE_PROXY: 'true'
      SB_CANONICAL_HOST: ${SB_CANONICAL_HOST}
      SB_GQL_ORIGIN: ${SB_GQL_ORIGIN}
      SB_JWT_SECRET: ${SB_JWT_SECRET}
      SB_REDIS_HOST: redis
      SB_REDIS_PORT: 6379
      SB_FILE_STORE: ${SB_FILE_STORE}
      SB_MAP_PARSER_MAX_CONCURRENT: ${SB_MAP_PARSER_MAX_CONCURRENT:-1}
      SB_REPLAY_WORKER_CONCURRENCY: ${SB_REPLAY_WORKER_CONCURRENCY:-1}
      SB_SPRITE_DATA: server/bw_sprite_data
      SB_SESSION_TTL: ${SB_SESSION_TTL}
      SB_ALLOW_UNSIGNED_SIGNUP: ${SB_ALLOW_UNSIGNED_SIGNUP:-true}
      SB_REQUIRE_CLIENT_ATTESTATION: ${SB_REQUIRE_CLIENT_ATTESTATION:-false}
      SB_MAILGUN_KEY: ${SB_MAILGUN_KEY}
      SB_MAILGUN_DOMAIN: ${SB_MAILGUN_DOMAIN}
      SB_MAILGUN_FROM: ${SB_MAILGUN_FROM}
      SB_ANALYTICS_ID: ${SB_ANALYTICS_ID:-}
      SB_DATADOG_KEY: ${SB_DATADOG_KEY:-}
      SB_DEEP_LINK_SCHEME: ${SB_DEEP_LINK_SCHEME}
      SB_DISABLE_CRAWLERS: ${SB_DISABLE_CRAWLERS:-}
      SB_DISCORD_WEBHOOK_URL: ${SB_DISCORD_WEBHOOK_URL:-}
      SB_RP2_COORDINATOR_URL: ${SB_RP2_COORDINATOR_URL}
      SB_RP2_TENANT: ${SB_RP2_TENANT}
      SB_RP2_CLIENT_KEY: ${SB_RP2_CLIENT_KEY}
      SB_RP2_RELAY_SERVER_NAME: ${SB_RP2_RELAY_SERVER_NAME}
      SB_RP2_ROLLBACK: ${SB_RP2_ROLLBACK:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /google-credentials.json
      SB_SERVER_RS_URL: http://server_rs:5556
    networks:
      - frontend
      - backend
    volumes:
      - app_logs:/home/node/shieldbattery/server/logs:rw
      - ./google-credentials.json:/google-credentials.json:ro
      - uploaded_files:/home/node/shieldbattery/server/uploaded_files:rw
      - ./bw_sprite_data:/home/node/shieldbattery/server/bw_sprite_data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      update_server:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '4'

  server_rs:
    image: ${HYPERSHIELD_SERVER_RS_IMAGE:-ghcr.io/saintromuald/hypershield-server-rs}:${SB_VERSION:-latest}
    restart: unless-stopped
    init: true
    expose:
      - '5556'
    environment:
      VIRTUAL_HOST: ${SB_GQL_VIRTUAL_HOST}
      VIRTUAL_PORT: 5556
      LETSENCRYPT_HOST: ${SB_GQL_VIRTUAL_HOST}
      SB_DB_HOST: db
      SB_DB_PORT: 5432
      SB_DB_USER: ${SB_DB_USER:-hypershield}
      SB_DB_PASSWORD: ${SB_DB_PASSWORD}
      SB_DB: ${SB_DB:-hypershield}
      SB_DB_POOL_MAX: ${SB_DB_POOL_MAX}
      SB_REDIS_HOST: redis
      SB_REDIS_PORT: 6379
      SB_GQL_HOST: '[::]'
      SB_GQL_PORT: 5556
      SB_HTTPS_REVERSE_PROXY: 'true'
      SB_CANONICAL_HOST: ${SB_CANONICAL_HOST}
      SB_MAILGUN_KEY: ${SB_MAILGUN_KEY}
      SB_MAILGUN_DOMAIN: ${SB_MAILGUN_DOMAIN}
      SB_MAILGUN_FROM: ${SB_MAILGUN_FROM}
      SB_DATADOG_KEY: ${SB_DATADOG_KEY:-}
      SB_JWT_SECRET: ${SB_JWT_SECRET}
      SB_SESSION_TTL: ${SB_SESSION_TTL}
      SB_FILE_STORE: ${SB_FILE_STORE}
      SB_DISCORD_WEBHOOK_URL: ${SB_DISCORD_WEBHOOK_URL:-}
      SB_GQL_ORIGIN: ${SB_GQL_ORIGIN}
      SB_RP2_COORDINATOR_URL: ${SB_RP2_COORDINATOR_URL}
      AWS_EC2_METADATA_DISABLED: 'true'
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      update_server:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '4'

  nginx_proxy:
    image: nginx:mainline
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
      - '443:443/udp'
    labels:
      - 'com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy'
    networks:
      - frontend
    volumes:
      - certs:/etc/nginx/certs:ro
      - nginx_conf:/etc/nginx/conf.d
      - nginx_dhparam:/etc/nginx/dhparam
      - nginx_html:/usr/share/nginx/html
      - nginx_vhost:/etc/nginx/vhost.d
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '4'

  proxy_gen:
    image: jwilder/docker-gen:0.7.0
    restart: unless-stopped
    command: -notify-sighup nginx_proxy -watch /etc/docker-gen/templates/nginx.tmpl /etc/nginx/conf.d/default.conf
    environment:
      ENABLE_IPV6: 'true'
    labels:
      - 'com.github.jrcs.letsencrypt_nginx_proxy_companion.docker_gen'
    networks:
      - frontend
    volumes:
      - certs:/etc/nginx/certs:ro
      - nginx_conf:/etc/nginx/conf.d
      - nginx_dhparam:/etc/nginx/dhparam
      - nginx_html:/usr/share/nginx/html
      - nginx_vhost:/etc/nginx/vhost.d
      - ../../appserver/docker-nginx.tmpl:/etc/docker-gen/templates/nginx.tmpl:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    depends_on:
      - nginx_proxy

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:stable
    restart: unless-stopped
    environment:
      DEFAULT_EMAIL: ${SB_LETSENCRYPT_EMAIL}
    networks:
      - frontend
    volumes:
      - certs:/etc/nginx/certs:rw
      - nginx_html:/usr/share/nginx/html
      - nginx_vhost:/etc/nginx/vhost.d
      - /var/run/docker.sock:/var/run/docker.sock:rw
    depends_on:
      - nginx_proxy
      - proxy_gen

  redis:
    image: redis:7.4.2
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 256M
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?missing POSTGRES_SUPER_PASSWORD}
      POSTGRES_DB: postgres
      SB_DB: ${SB_DB:-hypershield}
      SB_DB_USER: ${SB_DB_USER:-hypershield}
      SB_DB_PASSWORD: ${SB_DB_PASSWORD:?missing SB_DB_PASSWORD}
    networks:
      - backend
    volumes:
      - ../../appserver/db/init-scripts:/docker-entrypoint-initdb.d:ro
      - ../../appserver/db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - db_data:/var/lib/postgresql/data
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  update_server:
    image: ${HYPERSHIELD_SERVER_IMAGE:-ghcr.io/saintromuald/hypershield-server}:${SB_VERSION:-latest}
    init: true
    environment:
      SB_SESSION_TTL: ${SB_SESSION_TTL}
      SB_REDIS_HOST: redis
      SB_REDIS_PORT: 6379
      SB_FILE_STORE: ${SB_FILE_STORE}
      DATABASE_URL: postgres://${SB_DB_USER:-hypershield}:${SB_DB_PASSWORD}@db/${SB_DB:-hypershield}
    command:
      - ./server/deployment_files/wait.sh
      - --endpoint
      - db:5432:15
      - --endpoint
      - redis:6379:15
      - bash
      - -c
      - ./server/update_server.sh
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

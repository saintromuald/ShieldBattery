name: HyperShield desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag; its version must match package.json'
        required: true
        default: 'hypershield-v12.3.13'
      hyperionTag:
        description: 'Public Hyperion Shield Zero release to bundle'
        required: true
        default: 'hyperion-shield-zero-v0.7.3-beta'
      serverUrl:
        description: 'HyperShield server URL embedded in this client build'
        required: true
      channel:
        description: 'Publish as a prerelease or a stable release'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - stable

permissions:
  contents: write

concurrency:
  group: hypershield-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      HYPERION_TAG: ${{ inputs.hyperionTag }}
      SB_SERVER: ${{ inputs.serverUrl }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Validate the release version and channel
        run: |
          set -euo pipefail
          VERSION="${TAG#hypershield-v}"
          export VERSION
          if [ "$VERSION" = "$TAG" ] || [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like hypershield-v12.4.0 or hypershield-v12.4.0-rc.1" >&2
            exit 1
          fi
          node -e 'const fs = require("node:fs"); const expected = process.env.VERSION; for (const file of ["package.json", "app/package.json"]) { const actual = JSON.parse(fs.readFileSync(file, "utf8")).version; if (actual !== expected) { throw new Error(`${file} is ${actual}, but the release tag is ${expected}`); } }'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; choose a new version instead of replacing its assets." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./app

      - name: Download the public Hyperion Shield Zero package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hyperion-package" hyperion
          gh release download "$HYPERION_TAG" \
            --repo saintromuald/hyperion-public \
            --pattern 'Hyperion-Shield-Zero-*-linux-x64.tar.gz' \
            --pattern 'Hyperion-Shield-*-linux-x64.tar.gz' \
            --pattern 'HyperShield-Shield-*-linux-x64.tar.gz' \
            --dir "$RUNNER_TEMP/hyperion-package"
          archive=$(find "$RUNNER_TEMP/hyperion-package" -maxdepth 1 -type f \( -name 'Hyperion-Shield-Zero-*-linux-x64.tar.gz' -o -name 'Hyperion-Shield-*-linux-x64.tar.gz' -o -name 'HyperShield-Shield-*-linux-x64.tar.gz' \) -print -quit)
          if [ -z "$archive" ]; then
            echo "The Hyperion release has no public Linux x64 Shield package." >&2
            exit 1
          fi
          gh api "repos/saintromuald/hyperion-public/releases/tags/$HYPERION_TAG" > "$RUNNER_TEMP/hyperion-release.json"
          ARCHIVE="$archive" RELEASE_JSON="$RUNNER_TEMP/hyperion-release.json" node - <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const archive = process.env.ARCHIVE
          const metadata = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'))
          const name = require('node:path').basename(archive)
          const asset = metadata.assets.find(candidate => candidate.name === name)
          const actual = crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex')
          if (!asset || asset.digest !== `sha256:${actual}`) {
            throw new Error(`${name} failed SHA-256 verification: ${asset?.digest ?? 'missing digest'} versus sha256:${actual}`)
          }
          NODE
          tar -xzf "$archive" -C hyperion --no-same-owner
          test -x hyperion/Hyperion.x86_64
          test -f hyperion/libSDL3.so.0
          test -d hyperion/Data
          test -f hyperion/release.json
          test ! -e hyperion/Game
          EXPECTED_TAG="$HYPERION_TAG" node - <<'NODE'
          const fs = require('node:fs')
          const release = JSON.parse(fs.readFileSync('hyperion/release.json', 'utf8'))
          const version = process.env.EXPECTED_TAG.replace(/^(?:hyperion|hypershield)-shield(?:-zero)?-v/, '').replace(/^v/, '')
          const actualVersion = release.version.replace(/^v/, '')
          if (!['Hyperion Shield Zero', 'Hyperion Shield', 'HyperShield Shield'].includes(release.product) || release.gameFilesBundled !== false || actualVersion !== version) {
            throw new Error('The public Hyperion release metadata does not match the requested package')
          }
          NODE

      - name: Build the HyperShield AppImage
        run: |
          set -euo pipefail
          pnpm run clean
          node tools/prebuild.mjs
          pnpm run build-app-client
          pnpm exec electron-builder build --linux --x64 -c linux.yml

      - name: Check the release artifact
        run: |
          set -euo pipefail
          artifact="dist/HyperShield-${VERSION}-x86_64.AppImage"
          test -f "$artifact"
          chmod +x "$artifact"
          (cd dist && sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256")

      - name: Publish the versioned release
        run: |
          set -euo pipefail
          prerelease=()
          if [ "$CHANNEL" = prerelease ]; then prerelease=(--prerelease); fi
          artifact="dist/HyperShield-${VERSION}-x86_64.AppImage"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "HyperShield v${VERSION}" \
            --notes "Native Linux and Apple Silicon macOS HyperShield clients with Hyperion ${HYPERION_TAG}. Packages include the public Shield engine and no StarCraft game files. The Mac build is ad-hoc signed and not notarized; no Developer ID identity is used. Use the in-app release center to browse, install, or switch versions." \
            "${prerelease[@]}" \
            "$artifact" \
            "$artifact.sha256"

  macos-arm64:
    needs: linux-x64
    runs-on: macos-15-arm64
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      HYPERION_TAG: ${{ inputs.hyperionTag }}
      SB_SERVER: ${{ inputs.serverUrl }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Validate the release and host architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          VERSION="${TAG#hypershield-v}"
          export VERSION
          if [ "$VERSION" = "$TAG" ]; then
            echo 'The release tag must begin with hypershield-v.' >&2
            exit 1
          fi
          node -e 'const fs = require("node:fs"); const expected = process.env.VERSION; for (const file of ["package.json", "app/package.json"]) { const actual = JSON.parse(fs.readFileSync(file, "utf8")).version; if (actual !== expected) { throw new Error(`${file} is ${actual}, but the release tag is ${expected}`); } }'
          gh release view "$TAG" >/dev/null
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./app

      - name: Download and verify the exact public Mac Hyperion release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hyperion-package" "$RUNNER_TEMP/hyperion-extracted" hyperion
          gh release download "$HYPERION_TAG" \
            --repo saintromuald/hyperion-public \
            --pattern 'Hyperion-Shield-Zero-*-mac-arm64.zip' \
            --pattern 'Hyperion-Shield-*-mac-arm64.zip' \
            --pattern 'HyperShield-Shield-*-mac-arm64.zip' \
            --dir "$RUNNER_TEMP/hyperion-package"
          archive=$(find "$RUNNER_TEMP/hyperion-package" -maxdepth 1 -type f -name '*-mac-arm64.zip' -print -quit)
          if [ -z "$archive" ]; then
            echo 'The Hyperion release has no public Mac ARM64 Shield package.' >&2
            exit 1
          fi
          gh api "repos/saintromuald/hyperion-public/releases/tags/$HYPERION_TAG" > "$RUNNER_TEMP/hyperion-release.json"
          ARCHIVE="$archive" RELEASE_JSON="$RUNNER_TEMP/hyperion-release.json" node - <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const archive = process.env.ARCHIVE
          const metadata = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'))
          const name = require('node:path').basename(archive)
          const asset = metadata.assets.find(candidate => candidate.name === name)
          const actual = crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex')
          if (!asset || asset.digest !== `sha256:${actual}`) {
            throw new Error(`${name} failed SHA-256 verification: ${asset?.digest ?? 'missing digest'} versus sha256:${actual}`)
          }
          NODE
          ditto -x -k "$archive" "$RUNNER_TEMP/hyperion-extracted"
          app=$(find "$RUNNER_TEMP/hyperion-extracted" -type d -name Hyperion.app -prune -print)
          if [ -z "$app" ] || [ "$(printf '%s\n' "$app" | wc -l | tr -d ' ')" != 1 ]; then
            echo 'The Hyperion ZIP must contain exactly one Hyperion.app.' >&2
            exit 1
          fi
          package_root=$(dirname "$app")
          ditto "$package_root" hyperion
          test -x hyperion/Hyperion.app/Contents/MacOS/Hyperion
          test -f hyperion/Hyperion.app/Contents/MacOS/libSDL3.0.dylib
          test -f hyperion/Hyperion.app/Contents/Info.plist
          test -d hyperion/Data
          test -f hyperion/release.json
          test -f hyperion/EDITION.txt
          test ! -e hyperion/Game
          EXPECTED_TAG="$HYPERION_TAG" node - <<'NODE'
          const fs = require('node:fs')
          const release = JSON.parse(fs.readFileSync('hyperion/release.json', 'utf8'))
          const version = process.env.EXPECTED_TAG.replace(/^(?:hyperion|hypershield)-shield(?:-zero)?-v/, '').replace(/^v/, '')
          const actualVersion = release.version.replace(/^v/, '')
          if (!['Hyperion Shield Zero', 'Hyperion Shield', 'HyperShield Shield'].includes(release.product) || release.gameFilesBundled !== false || actualVersion !== version) {
            throw new Error('The public Hyperion release metadata does not match the requested Mac package')
          }
          NODE
          codesign --verify --deep --strict hyperion/Hyperion.app

      - name: Check the macOS integration
        run: pnpm vitest run app/startup.test.ts app/single-instance.test.ts app/game/gameplay-capabilities.test.ts app/game/hyperion app/releases tools/hypershield-macos-release.test.ts

      - name: Build HyperShield without the Windows game DLL
        run: pnpm run build:hypershield:release

      - name: Package the ad-hoc-signed Mac app
        run: pnpm exec electron-builder build --mac --arm64 -c hypershield-mac.yml

      - name: Check the DMG, ZIP, and update metadata
        run: |
          set -euo pipefail
          test -f "dist/HyperShield-${VERSION}-arm64-mac.dmg"
          test -f "dist/HyperShield-${VERSION}-arm64-mac.zip"
          test -f dist/latest-mac.yml
          grep -F "HyperShield-${VERSION}-arm64-mac.zip" dist/latest-mac.yml
          node tools/check-hyperion-package.cjs dist/mac-arm64/HyperShield.app darwin

      - name: Verify final app and nested ad-hoc signatures
        run: |
          set -euo pipefail
          app=dist/mac-arm64/HyperShield.app
          codesign --verify --deep --strict "$app"
          codesign --verify --deep --strict "$app/Contents/Resources/hyperion/Hyperion.app"
          helper_count=0
          while IFS= read -r -d '' helper; do
            codesign --verify --deep --strict "$helper"
            helper_count=$((helper_count + 1))
          done < <(find "$app/Contents/Frameworks" -type d -name '*.app' -print0)
          test "$helper_count" -gt 0

      - name: Smoke-test the exact release ZIP, framework links, and helpers
        run: |
          set -euo pipefail
          release_zip="$PWD/dist/HyperShield-${VERSION}-arm64-mac.zip"
          extracted="$RUNNER_TEMP/hypershield-release-zip"
          mkdir -p "$extracted"
          ditto -x -k "$release_zip" "$extracted"
          app="$extracted/HyperShield.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          codesign --verify --deep --strict "$app/Contents/Resources/hyperion/Hyperion.app"
          framework="$app/Contents/Frameworks/Electron Framework.framework"
          test -L "$framework/Versions/Current"
          test -L "$framework/Electron Framework"
          test -x "$framework/Versions/A/Electron Framework"
          helper_count=0
          while IFS= read -r -d '' helper; do
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$helper/Contents/Info.plist")
            test -x "$helper/Contents/MacOS/$executable"
            codesign --verify --deep --strict "$helper"
            helper_count=$((helper_count + 1))
          done < <(find "$app/Contents/Frameworks" -type d -name '*.app' -print0)
          test "$helper_count" -gt 0
          log="$RUNNER_TEMP/hypershield-zip-smoke.log"
          set +e
          SB_SESSION="zip-smoke-$$" \
            SB_PACKAGED_SMOKE_TEST=1 \
            SB_SERVER=http://127.0.0.1:9 \
            "$app/Contents/MacOS/HyperShield" --hidden >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          grep -F HYPERSHIELD_PACKAGED_SMOKE_OK "$log"
          echo "RELEASE_APP=$app" >> "$GITHUB_ENV"

      - name: Smoke-test the app installed from the mounted DMG
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/hypershield-dmg-mount"
          installed="$RUNNER_TEMP/hypershield-dmg-installed"
          mkdir -p "$mount" "$installed"
          hdiutil attach "$PWD/dist/HyperShield-${VERSION}-arm64-mac.dmg" \
            -mountpoint "$mount" -nobrowse -readonly -quiet
          trap 'hdiutil detach "$mount" -quiet >/dev/null 2>&1 || true' EXIT
          test -d "$mount/HyperShield.app"
          ditto "$mount/HyperShield.app" "$installed/HyperShield.app"
          codesign --verify --deep --strict "$installed/HyperShield.app"
          codesign --verify --deep --strict "$installed/HyperShield.app/Contents/Resources/hyperion/Hyperion.app"
          log="$RUNNER_TEMP/hypershield-dmg-smoke.log"
          set +e
          SB_SESSION="dmg-smoke-$$" \
            SB_PACKAGED_SMOKE_TEST=1 \
            SB_SERVER=http://127.0.0.1:9 \
            "$installed/HyperShield.app/Contents/MacOS/HyperShield" --hidden >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          grep -F HYPERSHIELD_PACKAGED_SMOKE_OK "$log"

      - name: Smoke-test the packaged Hyperion identity protocol
        run: |
          set -euo pipefail
          ENGINE="$RELEASE_APP/Contents/Resources/hyperion/Hyperion.app/Contents/MacOS/Hyperion" \
          IDENTITY_DATA="$RUNNER_TEMP/hyperion-identity-data" \
          node - <<'NODE'
          const { spawnSync } = require('node:child_process')
          const fs = require('node:fs')
          fs.mkdirSync(process.env.IDENTITY_DATA, { recursive: true, mode: 0o700 })
          const result = spawnSync(process.env.ENGINE, ['--sb-identity', '--data', process.env.IDENTITY_DATA], {
            encoding: 'utf8',
            env: { ...process.env, HYPERION_WINDOW: 'hidden' },
            timeout: 30_000,
            maxBuffer: 1024 * 1024,
          })
          process.stderr.write(result.stderr || '')
          if (result.error || result.status !== 0) {
            throw result.error || new Error(`Hyperion identity exited with ${result.status}`)
          }
          const identity = JSON.parse(result.stdout)
          if (!Number.isInteger(identity.adapterProtocol) || !identity.engineBuild || !Number.isInteger(identity.simRevision)) {
            throw new Error('Hyperion returned an invalid identity response')
          }
          NODE

      - name: Attach the tested Mac assets to the same GitHub release
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "dist/HyperShield-${VERSION}-arm64-mac.dmg" \
            "dist/HyperShield-${VERSION}-arm64-mac.zip" \
            dist/latest-mac.yml

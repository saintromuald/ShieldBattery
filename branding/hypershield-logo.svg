<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HyperShield</title>
  <desc id="desc">The Hyperion Zero H shield with angelic wings and a gold halo</desc>
  <defs>
    <linearGradient id="shield" x1="86" y1="78" x2="172" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#163454"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="wings" x1="30" y1="70" x2="98" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f7ff"/>
      <stop offset="0.58" stop-color="#ffe39a"/>
      <stop offset="1" stop-color="#39d98a"/>
    </linearGradient>
    <linearGradient id="orbit" x1="100" y1="160" x2="158" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39d98a"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
  </defs>

  <!-- Halo: a bright inner ring and a restrained outer glow. -->
  <ellipse cx="128" cy="34" rx="39" ry="13" fill="none" stroke="#ffc400" stroke-width="10" opacity="0.18"/>
  <ellipse cx="128" cy="34" rx="39" ry="13" fill="none" stroke="#ffd75e" stroke-width="4"/>

  <!-- Angelic wings, inherited from the Hyperion Zero emblem's white-and-gold palette. -->
  <g fill="url(#wings)" stroke="#f4f7ff" stroke-width="1.5" stroke-linejoin="round">
    <path d="M91 105C72 79 46 64 17 61C24 81 40 103 65 119C48 112 32 110 18 113C34 137 58 151 91 154L108 124Z"/>
    <path d="M91 145C68 143 48 151 34 165C53 179 75 183 99 174L108 148Z"/>
    <path d="M165 105C184 79 210 64 239 61C232 81 216 103 191 119C208 112 224 110 238 113C222 137 198 151 165 154L148 124Z"/>
    <path d="M165 145C188 143 208 151 222 165C203 179 181 183 157 174L148 148Z"/>
  </g>
  <g fill="none" stroke="#163454" stroke-width="2.2" stroke-linecap="round" opacity="0.42">
    <path d="M32 76C47 94 62 111 82 130M34 123C53 133 68 141 88 145M49 163C64 164 78 161 94 155"/>
    <path d="M224 76C209 94 194 111 174 130M222 123C203 133 188 141 168 145M207 163C192 164 178 161 162 155"/>
  </g>

  <!-- The Hyperion Zero H, carried forward inside a shield. -->
  <path d="M128 72L176 90V128C176 163 156 191 128 208C100 191 80 163 80 128V90Z" fill="url(#shield)" stroke="#ffc400" stroke-width="4" stroke-linejoin="round"/>
  <path d="M153 101A36 36 0 1 1 103 158" fill="none" stroke="url(#orbit)" stroke-width="4" stroke-linecap="round"/>
  <path d="M105 105V155M151 105V155M105 130H151" fill="none" stroke="#f4f7ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M161 86L168 89L165 98L160 95Z" fill="#ffc400"/>
</svg>
